name: generate breakout svg

on:
  schedule:
    - cron: "0 0 * * *"    # günde 1 (UTC 00:00)
  workflow_dispatch:        # elle tetikleme

jobs:
  generate-svg:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: generate SVG
        uses: cyprieng/github-breakout@v1
        with:
          github_username: ${{ github.repository_owner }}
          enable_ghost_bricks: false
          # İstersen renkleri aç (custom.svg üretir):
          # bricks_colors: "#1e293b,#334155,#475569,#64748b,#94a3b8"
          # paddle_color:  "#94a3b8"
          # ball_color:    "#94a3b8"

      - name: Inspect output folder (debug)
        run: |
          echo "Listing output/"
          ls -la output || true

      - name: Collect generated SVGs safely
        run: |
          mkdir -p /tmp/breakout-images

          # custom.svg varsa her ihtimale karşı 3 isimle de kopyala (README kırılmasın)
          if [ -f output/custom.svg ]; then
            cp output/custom.svg /tmp/breakout-images/breakout-custom.svg
            cp output/custom.svg /tmp/breakout-images/breakout-light.svg
            cp output/custom.svg /tmp/breakout-images/breakout-dark.svg
          fi

          # light/dark üretilmişse bunlar custom üstüne yazsın (tema duyarlı kullanım)
          if [ -f output/light.svg ]; then
            cp -f output/light.svg /tmp/breakout-images/breakout-light.svg
          fi
          if [ -f output/dark.svg ]; then
            cp -f output/dark.svg /tmp/breakout-images/breakout-dark.svg
          fi

          echo "Resulting files:"
          ls -la /tmp/breakout-images

          # Hiç dosya yoksa maksatlı olarak fail et (kökten sorun varsa görelim)
          test -e /tmp/breakout-images/breakout-light.svg || test -e /tmp/breakout-images/breakout-custom.svg

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and force-push SVGs to target branch
        run: |
          git checkout --orphan github-breakout
          git rm -rf .
          mkdir -p images
          cp /tmp/breakout-images/* images/ || true
          git add images
          git commit -m "chore: update GitHub breakout SVGs" || echo "No changes to commit"
          git push --force origin github-breakout
